name: Tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js; do node --check "$f"; done
      - name: Parser tests
        run: node test/parse.test.js
      - name: Sync merge tests
        run: node test/sync.test.js
